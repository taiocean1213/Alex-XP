name: Wiki

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/render_wiki.py
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish the docs wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render wiki pages
        run: python3 scripts/render_wiki.py . "$RUNNER_TEMP/wiki-out"
      - name: Push wiki
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          if ! git ls-remote "$WIKI_URL" HEAD >/dev/null 2>&1; then
            echo "::error::GitHub has not created ${{ github.repository }}.wiki.git yet. The wiki feature can be on, and clone still returns 'repository not found', until the first page is saved in the browser. There is no API for that page. Sign in, open https://github.com/${{ github.repository }}/wiki/_new, save a page named Home, then rerun this workflow."
            exit 1
          fi
          rm -rf wiki
          git clone "$WIKI_URL" wiki
          if git -C wiki rev-parse --verify HEAD >/dev/null 2>&1; then
            branch="$(git -C wiki rev-parse --abbrev-ref HEAD)"
          else
            branch="master"
            git -C wiki checkout -B master
          fi
          find wiki -maxdepth 1 -name '*.md' -delete
          cp "$RUNNER_TEMP/wiki-out/"*.md wiki/
          git -C wiki add -A
          if git -C wiki diff --cached --quiet; then
            echo "Wiki pages are already current"
            exit 0
          fi
          git -C wiki \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish the tutorial wiki from docs"
          git -C wiki push origin "HEAD:${branch}"
